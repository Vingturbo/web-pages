<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <link rel="icon" href="../favicon.png">
    <title>国际妇女节快乐</title>
    <style>
        :root {
            --primary-color: #ff758c;
            --secondary-color: #ff7eb3;
        }

        body {
            margin: 0;
            height: 100vh;
            font-family: 'Microsoft YaHei', sans-serif;
            overflow: hidden;
        }

        body::after {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg,
                    var(--primary-color) 20%,
                    var(--secondary-color) 80%);
            animation: flow 20s linear infinite;
            z-index: -1;
        }

        .title {
            text-align: center;
            color: #fff;
            margin-top: 5%;
            animation: float 3s ease-in-out infinite;
            text-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            font-size: 2.5rem;
        }

        .blessing-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            padding: 3rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 1rem;
            perspective: 1000px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            min-height: 250px;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.8s;
        }

        .card:hover .card-inner {
            transform: rotateY(180deg);
        }

        .card-front,
        .card-back {
            backface-visibility: hidden;
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            box-sizing: border-box;
        }

        .card-back {
            transform: rotateY(180deg);
            background: #fff;
            border-radius: 15px;
        }

        #particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .heart-cursor {
            position: absolute;
            pointer-events: none;
            animation: heartbeat 1.2s ease-out;
            width: 20px;
            height: 20px;
        }

        @keyframes flow {
            0% {
                transform: translate(0, 0) rotate(0deg);
            }

            50% {
                transform: translate(25%, 25%) rotate(180deg);
            }

            100% {
                transform: translate(0, 0) rotate(360deg);
            }
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-20px);
            }
        }

        @keyframes heartbeat {
            0% {
                transform: scale(0);
                opacity: 1;
            }

            100% {
                transform: scale(2);
                opacity: 0;
            }
        }

        @media (max-width: 768px) {
            .blessing-cards {
                padding: 1rem;
            }

            .title {
                font-size: 2rem;
                margin-top: 15%;
            }
        }
    </style>
</head>

<body>
    <canvas id="particles"></canvas>
    <h1 class="title">🌸 致敬每一个闪耀的她 🌸</h1>
    <div class="blessing-cards">
        <div class="card">
            <div class="card-inner">
                <div class="card-front">
                    <h2>致伟大的女性</h2>
                    <p>愿你眼中总有光芒<br>手中总有鲜花<br>成为自己的太阳</p>
                </div>
                <div class="card-back">
                    <p>🌺 独立自信<br>🌼 活出精彩</p>
                </div>
            </div>
        </div>
        <div class="card">
            <div class="card-inner">
                <div class="card-front">
                    <h2>致职场女性</h2>
                    <p>愿你以专业赢得尊重<br>用智慧书写人生<br>在事业中绽放光芒</p>
                </div>
                <div class="card-back">
                    <p>💼 事业步步高升<br>🌟 活出精彩人生</p>
                </div>
            </div>
        </div>
        <div class="card">
            <div class="card-inner">
                <div class="card-front">
                    <h2>致母亲</h2>
                    <p>你的温暖照亮人生<br>你的坚强传承家风<br>你的笑容是最美的花</p>
                </div>
                <div class="card-back">
                    <p>❤️ 岁月从不败美人<br>🌹 永远的女神</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        // 心形粒子系统
        class Particle {
            constructor() {
                this.reset();
                this.img = new Image();
                this.img.src = "data:image/svg+xml,%3Csvg viewBox='0 0 24 24' fill='%23ffffff'%3E%3Cpath d='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z'/%3E%3C/svg%3E";
            }
            reset() {
                const canvas = document.getElementById('particles');
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 15 + 5;
                this.speed = Math.random() * 2 + 1;
                this.alpha = Math.random() * 0.5 + 0.5;
            }
            update() {
                this.y -= this.speed;
                if (this.y < -this.size) this.reset();
            }
            draw(ctx) {
                ctx.globalAlpha = this.alpha;
                ctx.drawImage(this.img, this.x, this.y, this.size, this.size);
            }
        }

        // 初始化粒子系统
        function createParticles() {
            const canvas = document.getElementById('particles');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = Array.from({ length: 50 }, () => new Particle());

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    p.update();
                    p.draw(ctx);
                });
                requestAnimationFrame(animate);
            }
            animate();
        }

        // 页面初始化
        window.addEventListener('load', () => {
            createParticles();
            gsap.from('.title', {
                duration: 1.5,
                opacity: 0,
                y: -50,
                ease: 'power4.out'
            });

            gsap.from('.card', {
                duration: 1.2,
                opacity: 0,
                y: 100,
                rotationX: 180,
                stagger: 0.15,
                ease: 'elastic.out(1, 0.5)'
            });
        });

        // 窗口大小调整适配
        window.addEventListener('resize', () => {
            const canvas = document.getElementById('particles');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>

</html>
