<html lang="zh-CN">

<head>

    <title>性能测试</title>
</head>

<body>
    <h1>网页端性能测试</h1>
    <p>Tips: 结果仅供参考，无法作为评判标准</p>
    <button id="b" onclick="abcd();" style="width: 25%; margin: auto;">我已知晓并同意，点击开启测试</button>
    <p id="output"></p>
    <script>
        function abcd() {
            var output = document.getElementById("output");
            output.textContent = "正在测试性能……预计耗费20秒";
            var zh = 0;
            for (var i = 1; i <= 20; i++) {
                var dtime = Date.now();
                while (Date.now() <= (dtime + 1000)) {
                    var fuck = Math.random() * Math.random();
                    zh += 1;
                }
            }
            output.textContent = "测试分数为: " + Math.floor(zh / 20);
        }
    </script>
</body>
