<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <!-- 设置文档的字符编码为 UTF-8，确保能正确显示中文等字符 -->
    <meta charset="UTF-8">
    <!-- 让页面在移动设备上正确显示 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 设置网页标题 -->
    <title>文本网页</title>
</head>

<body>
    <!-- 用于显示根据参数获取的文字 -->
    <div id="displayText"></div>

    <script>
        // 获取当前 URL 的查询字符串部分
        const queryString = window.location.search;
        // 创建一个 URLSearchParams 对象，用于解析查询字符串
        const urlParams = new URLSearchParams(queryString);
        // 从 URL 参数中获取 text 参数的值
        const textParam = urlParams.get('text');

        // 获取用于显示文字的 div 元素
        const displayDiv = document.getElementById('displayText');

        if (textParam) {
            // 如果 text 参数存在，将其值显示在 div 中
            displayDiv.textContent = atob(textParam);
        } else {
            // 如果 text 参数不存在，显示提示信息
            displayDiv.textContent = '未提供base64编码的 text 参数';
        }
    </script>
</body>

</html>
