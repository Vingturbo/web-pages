    <script>
        var uuid = document.getElementById('uuid');
        navigator.geolocation.getCurrentPosition(jw);
        function jw(showPosition){
            uuid.textContent = "UUID: " + btoa(showPosition.coords.longitude + '-' + showPosition.coords.latitude);
        }
        
        function RandomPhoto() {
            var newTab = window.open('about:blank', '_blank');
            var randomLine = '';
            var xhr = new XMLHttpRequest();
            xhr.open('GET', 'https://xnn-image.pages.dev/xnn-image-index.txt', true);
            xhr.send();
            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    var lines = xhr.responseText.split('\n');
                    randomLine = lines[Math.floor(Math.random() * lines.length)];
                    var PhotoURL = 'https://xnn-image.pages.dev' + randomLine.slice(1);
                    newTab.location.href = PhotoURL;
                }
            }
        }
    </script>
