<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.png">
    <link rel="stylesheet" href="info.css">
    <title>链接跳转器</title>
</head>

<body>
    <noscript>
        <style>
            .libjs {
                display: none;
            }
        </style>
        <h1>不是，你他妈找茬呢？不开JavaScript你看你老母呢？</h1>
    </noscript>

    <div class="libjs">
        <input id="u" placeholder="输入网址后跳转"><button
            onclick="location=u.value?(u.value.includes('://')?u.value:'https://'+u.value):'https://vingturbo.pages.dev/'">跳转</button><br>
        <input id="d" placeholder="输入文件链接后下载"><button
            onclick="var x=d.value?(d.value.includes('://')?d.value:'https://'+d.value):'https://example.com';fetch(x).then(r=>r.blob()).then(b=>{var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='';a.click()}).catch(()=>location=x)">下载</button>
    </div>
</body>

</html>
