<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.png">
    <link rel="stylesheet" href="info.css">
    <title>链接跳转器</title>
</head>

<body>
    <noscript>
        <style>
            .libjs { display: none; }
        </style>
        <div class="card" style="text-align:center;border-color:var(--accent-red);">
            <p>⚠ 请启用 JavaScript 以获得完整体验</p>
        </div>
    </noscript>

    <div class="terminal-header">
        <span class="prompt">vingturbo@home:~$</span>
        <span class="nav-links">
            <a href="./main.html">home</a>
        </span>
    </div>

    <div class="libjs">
        <h1><span class="accent">~/redirect</span> 链接跳转器</h1>

        <div class="card">
            <label for="u">输入网址后跳转</label>
            <div style="display:flex;gap:0.5rem;margin-top:0.3rem;">
                <input id="u" placeholder="https://example.com" style="flex:1;">
                <button onclick="location=u.value?(u.value.includes('://')?u.value:'https://'+u.value):'https://vingturbo.pages.dev/'">跳转</button>
            </div>
        </div>

        <div class="card">
            <label for="d">输入文件链接后下载</label>
            <div style="display:flex;gap:0.5rem;margin-top:0.3rem;">
                <input id="d" placeholder="https://example.com/file.zip" style="flex:1;">
                <button onclick="var x=d.value?(d.value.includes('://')?d.value:'https://'+d.value):'https://example.com';fetch(x).then(r=>r.blob()).then(b=>{var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='';a.click()}).catch(()=>location=x)">下载</button>
            </div>
        </div>
    </div>
</body>

</html>
