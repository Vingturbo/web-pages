<!DOCTYPE html><html><body>
<input id="u" placeholder="输入网址后跳转"><button onclick="location=u.value?(u.value.includes('://')?u.value:'https://'+u.value):'https://vingturbo.pages.dev/'">跳转</button><br>
<input id="d" placeholder="输入文件链接后下载"><button onclick="var x=d.value?(d.value.includes('://')?d.value:'https://'+d.value):'https://example.com';fetch(x).then(r=>r.blob()).then(b=>{var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='';a.click()}).catch(()=>location=x)">下载</button>
</body></html>
