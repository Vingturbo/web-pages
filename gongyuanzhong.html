<!DOCTYPE html>

<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.png">
    <link rel="stylesheet" href="info.css">
    <title>公元钟</title>
</head>

<body>
    <div class="terminal-header">
        <span class="prompt">vingturbo@home:~$</span>
        <span class="nav-links">
            <a href="./main.html">home</a>
        </span>
    </div>

    <h1><span class="accent">~/gongyuanzhong</span> 公元钟</h1>
    <p class="text-muted">像素死亡动画 — 5 天内所有像素将逐一点亮</p>

    <canvas id="canvas" width="370" height="166" style="border:1px solid var(--border-color);border-radius:var(--radius-md);display:block;margin:1rem auto;max-width:100%;"></canvas>

    <div class="card" style="text-align:center;">
        <label>时间倍速: <input id="timer" type="number" value="1.0" step="0.1" style="width:80px;"></label>
    </div>

    <script>
        var canvas = document.getElementById('canvas');
        var timer = document.getElementById('timer');
        var ctx = canvas.getContext('2d');
        var width = canvas.width;   // 370
        var height = canvas.height; // 166
        var total = width * height; // 61420

        // ---------- 1. 初始化全屏绿色（使用 ImageData） ----------
        var imageData = ctx.createImageData(width, height);
        var data = imageData.data;
        for (var i = 0; i < data.length; i += 4) {
            data[i] = 0;       // R
            data[i + 1] = 255; // G
            data[i + 2] = 0;   // B
            data[i + 3] = 255; // A
        }
        ctx.putImageData(imageData, 0, 0);

        // ---------- 2. 生成每个像素的死亡进度（正态分布） ----------
        var deathTimes = new Float64Array(total);
        for (var i = 0; i < total; i++) {
            var u1, u2;
            do { u1 = Math.random(); } while (u1 === 0);
            u2 = Math.random();
            var z = Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
            var d = 0.5 + 0.13 * z;
            if (d < 0) d = 0;
            if (d > 1) d = 1;
            deathTimes[i] = d;
        }
        deathTimes[0] = 1.0;

        // ---------- 3. 创建索引数组并按死亡时间排序 ----------
        var order = new Uint32Array(total);
        for (var i = 0; i < total; i++) order[i] = i;
        order.sort(function(a, b) {
            return deathTimes[a] - deathTimes[b];
        });

        // ---------- 4. 时间控制 ----------
        var startTime = Date.now();
        var pointer = 0;

        // ---------- 5. 渲染循环 ----------
        function update() {
            var speed = parseFloat(timer.value) || 1.0;
            var totalDuration = 5 * 24 * 60 * 60 * 1000 / speed;
            var now = Date.now();
            var elapsed = now - startTime;
            var p = elapsed / totalDuration;
            if (p > 1) p = 1;

            while (pointer < total && deathTimes[order[pointer]] <= p) {
                var idx = order[pointer];
                var x = idx % width;
                var y = (idx / width) | 0;
                var pos = (y * width + x) * 4;
                data[pos] = 0;
                data[pos + 1] = 0;
                data[pos + 2] = 0;
                pointer++;
            }
            ctx.putImageData(imageData, 0, 0);

            if (p < 1) {
                requestAnimationFrame(update);
            }
        }

        update();
    </script>
</body>

</html>
