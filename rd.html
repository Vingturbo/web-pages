<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        @font-face {
            font-family: 'Unifont';
            src: url('https://web-site-hub.pages.dev/unifont-17.0.05.woff2') format('woff2');
            font-display: swap;
        }
        html, body {
            margin: 0;
            height: 100%;
            background: transparent;
            overflow: hidden;
        }
        /* 透明遮罩：占满全屏，挡住滚动和点击 */
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            z-index: 1;
        }
        /* 卡片：初始隐藏，等字体加载完再显示 */
        #card {
            visibility: hidden;
            position: fixed;
            background: #000;
            border-radius: 16px;
            display: flex;
            align-items: center;
            padding: 0 8px;
            box-sizing: border-box;
            color: #fff;
            font-family: 'Unifont', monospace;
            z-index: 2;
        }
        #icon {
            width: 64px;
            height: 64px;
            flex-shrink: 0;
            object-fit: cover;
            border-radius: 8px;
            margin-right: 8px;
        }
        .site-text {
            flex: 1;
            min-width: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 4px;
            padding: 12px 0;
            box-sizing: border-box;
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
        }
        .site-text h3 {
            font-size: 1rem;
            font-weight: bold;
            margin: 0;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .site-text p {
            font-size: 0.85rem;
            color: #ccc;
            margin: 0;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>
    <div id="overlay"></div>
    <div id="card">
        <img id="icon" src="">
        <div class="site-text">
            <h3 id="name"></h3>
            <p id="desc"></p>
        </div>
    </div>
    <script>
        var p = new URLSearchParams(window.location.search);
        var x = parseInt(p.get('x'));
        var y = parseInt(p.get('y'));
        var w = parseInt(p.get('w'));
        var h = parseInt(p.get('h'));
        var iconUrl = p.get('icon');
        var siteName = p.get('name') || '';
        var desc = p.get('desc') || '';

        var welcomeText = '欢迎你，陌生人……';
        var cursor = '_';
        var interval = 200;

        // 用图标坐标反推卡片位置
        // SiteHub 的 .card padding 是 0 8px，图标左边缘比卡片左边缘多 8px
        var cardH = 80;
        var cardLeft = x - 8;
        var cardTop = y - (cardH - h) / 2;
        var cardW = window.innerWidth - cardLeft * 2;

        var card = document.getElementById('card');
        card.style.left = cardLeft + 'px';
        card.style.top = cardTop + 'px';
        card.style.width = cardW + 'px';
        card.style.height = cardH + 'px';

        document.getElementById('icon').src = iconUrl;
        document.getElementById('desc').textContent = desc || '暂无简介';

        var nameEl = document.getElementById('name');

        function startAnimation() {
            // 显示卡片
            card.style.visibility = 'visible';

            if (siteName.length === 0) {
                startTyping();
            } else {
                nameEl.textContent = siteName + cursor;
                var i = siteName.length;
                var deleteTimer = setInterval(function () {
                    i--;
                    if (i < 0) {
                        clearInterval(deleteTimer);
                        startTyping();
                        return;
                    }
                    nameEl.textContent = siteName.slice(0, i) + cursor;
                }, interval);
            }
        }

        function startTyping() {
            var j = 0;
            var typeTimer = setInterval(function () {
                j++;
                if (j > welcomeText.length) {
                    clearInterval(typeTimer);
                    setTimeout(function () {
                        window.parent.postMessage({ type: 'sitehub-redirect-ready' }, '*');
                    }, 500);
                    return;
                }
                nameEl.textContent = welcomeText.slice(0, j) + cursor;
            }, interval);
        }

        // 字体加载完再启动，最多等 2 秒
        var started = false;
        function tryStart() {
            if (started) return;
            started = true;
            startAnimation();
        }

        if (document.fonts && document.fonts.load) {
            document.fonts.load('1em Unifont').then(tryStart).catch(tryStart);
        }
        setTimeout(tryStart, 2000);
    </script>
</body>
</html>
