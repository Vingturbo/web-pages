<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        @font-face {
            font-family: 'Unifont';
            src: local('Unifont'), url('https://web-site-hub.pages.dev/unifont-17.0.05.woff2') format('woff2');
            font-display: swap;
        }
        html, body {
            margin: 0;
            height: 100%;
            background: transparent;
            overflow: hidden;
        }
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            z-index: 1;
        }
        #card {
            visibility: hidden;
            position: fixed;
            left: 10vw;
            width: 80vw;
            background: #000;
            border-radius: 16px;
            display: flex;
            align-items: center;
            padding: 0 8px;
            box-sizing: border-box;
            color: #fff;
            font-family: 'Unifont', monospace;
            z-index: 2;
        }
        #icon {
            width: 64px;
            height: 64px;
            flex-shrink: 0;
            object-fit: cover;
            border-radius: 8px;
            margin-right: 8px;
        }
        .site-text {
            flex: 1;
            min-width: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 4px;
            padding: 12px 0;
            box-sizing: border-box;
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
        }
        .site-text h3 {
            font-size: 1rem;
            font-weight: bold;
            margin: 0;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .site-text p {
            font-size: 0.85rem;
            color: #ccc;
            margin: 0;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .skip-link {
            position: absolute;
            top: 8px;
            right: 8px;
            color: #ccc;
            font-size: 0.75rem;
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
        }
        .skip-link:hover {
            color: #fff;
        }
    </style>
</head>
<body>
    <div id="overlay"></div>
    <div id="card">
        <img id="icon" src="">
        <div class="site-text">
            <h3 id="name"></h3>
            <p id="desc"></p>
        </div>
        <span class="skip-link" id="skip-link">直接跳转↗</span>
    </div>
    <script>
        var p = new URLSearchParams(window.location.search);
        var y = parseInt(p.get('y'));
        var h = parseInt(p.get('h'));
        var iconUrl = p.get('icon');
        var siteName = p.get('name') || '';
        var desc = p.get('desc') || '';

        var welcomeText = '欢迎你，陌生人……';
        var cursor = '_';
        var interval = 200;

        var HOVER_OFFSET = 4;
        var cardH = 80;
        var cardTop = y + HOVER_OFFSET - (cardH - h) / 2;

        var card = document.getElementById('card');
        card.style.top = cardTop + 'px';
        card.style.height = cardH + 'px';

        document.getElementById('icon').src = iconUrl;
        document.getElementById('desc').textContent = desc || '暂无简介';

        var nameEl = document.getElementById('name');

        // ==== 跳过动画：通知父页面直接跳转 ====
        function skip() {
            window.parent.postMessage({ type: 'sitehub-redirect-ready' }, '*');
        }

        document.getElementById('skip-link').addEventListener('click', function (e) {
            e.preventDefault();
            e.stopPropagation();
            skip();
        });

        window.addEventListener('keydown', function (e) {
            if (e.key.toLowerCase() === 'p') {
                skip();
            }
        });

        // ==== 动画 ====
        function startAnimation() {
            card.style.visibility = 'visible';

            if (siteName.length === 0) {
                startTyping();
            } else {
                nameEl.textContent = siteName + cursor;
                var i = siteName.length;
                var deleteTimer = setInterval(function () {
                    i--;
                    if (i < 0) {
                        clearInterval(deleteTimer);
                        startTyping();
                        return;
                    }
                    nameEl.textContent = siteName.slice(0, i) + cursor;
                }, interval);
            }
        }

        function startTyping() {
            var j = 0;
            var typeTimer = setInterval(function () {
                j++;
                if (j > welcomeText.length) {
                    clearInterval(typeTimer);
                    setTimeout(function () {
                        window.parent.postMessage({ type: 'sitehub-redirect-ready' }, '*');
                    }, 500);
                    return;
                }
                nameEl.textContent = welcomeText.slice(0, j) + cursor;
            }, interval);
        }

        var started = false;
        function tryStart() {
            if (started) return;
            started = true;
            startAnimation();
        }

        if (document.fonts && document.fonts.load) {
            document.fonts.load('1em Unifont').then(tryStart).catch(tryStart);
        }
        setTimeout(tryStart, 2000);
    </script>
</body>
</html>
