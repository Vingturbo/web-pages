<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        @font-face {
            font-family: 'Unifont';
            src: url('https://web-site-hub.pages.dev/unifont-17.0.05.woff2') format('woff2');
            font-display: swap;
        }
        html, body {
            margin: 0;
            height: 100%;
            background: transparent;
        }
        #card {
            position: fixed;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 16px;
            display: flex;
            align-items: center;
            padding: 0 8px;
            box-sizing: border-box;
            color: #fff;
            font-family: 'Unifont', monospace;
        }
        #icon {
            width: 64px;
            height: 64px;
            flex-shrink: 0;
            object-fit: cover;
            border-radius: 8px;
            margin-right: 8px;
        }
        #text {
            flex: 1;
            min-width: 0;
            font-size: 1rem;
            font-weight: bold;
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div id="card">
        <img id="icon" src="">
        <div id="text"></div>
    </div>
    <script>
        var p = new URLSearchParams(window.location.search);
        var x = parseInt(p.get('x'));
        var y = parseInt(p.get('y'));
        var w = parseInt(p.get('w'));
        var h = parseInt(p.get('h'));
        var iconUrl = p.get('icon');
        var siteName = p.get('name') || '';
        var desc = p.get('desc') || '';

        var welcomeText = '欢迎你，陌生人……';
        var cursor = '_';
        var interval = 200;

        var cardW = window.innerWidth * 0.8;
        var cardH = 80;
        var cardLeft = (window.innerWidth - cardW) / 2;
        var cardTop = y - (cardH - h) / 2;

        var card = document.getElementById('card');
        card.style.left = cardLeft + 'px';
        card.style.top = cardTop + 'px';
        card.style.width = cardW + 'px';
        card.style.height = cardH + 'px';

        var icon = document.getElementById('icon');
        icon.src = iconUrl;

        var text = document.getElementById('text');

        if (siteName.length === 0) {
            // 没拿到名字，直接进入打字阶段
            startTyping();
        } else {
            text.textContent = siteName + cursor;
            var i = siteName.length;
            var deleteTimer = setInterval(function () {
                i--;
                if (i < 0) {
                    clearInterval(deleteTimer);
                    startTyping();
                    return;
                }
                text.textContent = siteName.slice(0, i) + cursor;
            }, interval);
        }

        function startTyping() {
            var j = 0;
            var typeTimer = setInterval(function () {
                j++;
                if (j > welcomeText.length) {
                    clearInterval(typeTimer);
                    setTimeout(function () {
                        window.parent.postMessage({ type: 'sitehub-redirect-ready' }, '*');
                    }, 500);
                    return;
                }
                text.textContent = welcomeText.slice(0, j) + cursor;
            }, interval);
        }
    </script>
</body>
</html>
